spack:
  specs:
    - boost@1.90.0 +program_options +test +json +graph +filesystem
    - cmake@4.4.2
    - ccache@4.12
    - edm4hep@1.1
    - eigen@5.0.1
    - intel-tbb@2023.1.0
    - nlohmann-json@3.12.0
    - podio@1.7
    - root@6.40.02 -aqua -opengl -cxxmodules
    - dd4hep@1.37 +xercesc +edm4hep +hepmc3
    - geomodel@6.31.0 +geomodelg4
    - python@3.14
    - py-pybind11 @3.0.4
    - py-pip
    - py-jinja2 # for edm4hep + podio
    - py-pyyaml # for edm4hep + podio

    - hepmc3@3.3.1 +rootio
      # compression libraries that can be used by hepmc3 if configured
    - zstd build_system=cmake
    - lz4
    - zlib-ng
    - bzip2

    - git@2
    - ninja

    - pythia8@8.317 -hepmc +hepmc3
    - geant4@11.4.2 -data
    - fastjet@3.5.1 plugins=cxx

    - onnxruntime-bin@1.24.4

    - millepede@5.1.5 +root
    - mille@1.1.0 +root
    - generalbrokenlines@4.0.3 +root

    - googletest@1.17.0
      # perf counters only supported on linux
    - benchmark@1.9.5
    - arrow@24.0.0 +bz2 +parquet +zlib +zstd +dataset +filesystem +compute +snappy +brotli +python

    - actsvg@0.4.57

    # detray/traccc host (CPU) builds. ACTS vendors traccc, detray and
    # algebra-plugins via FetchContent, but resolves vecmem and covfie with
    # find_package, so they have to come from the environment. Versions are the
    # newest the consumers agree on: vecmem 1.25.0 is what both ACTS
    # (_acts_vecmem_version) and traccc/extern pin; covfie 0.15.6 is ahead of
    # ACTS' 0.15.2 and traccc's 0.15.4 floors, which are find_package minimums.
    # Re-check when either moves.
    #
    # These are the plain CPU builds. The cuda13 / rocm7 flavors flip the
    # accelerator variant on these same root specs (see flavors/*.specs), so the
    # versions live here only.
    - vecmem@1.27.0
    - covfie@0.15.6

    # Alpaka, traccc's portability backend, serial (CPU) backend only. Pinned to
    # what traccc/extern/alpaka fetches, so a TRACCC_USE_SYSTEM_ALPAKA build gets
    # the version traccc is tested against rather than the newest spack has.
    - alpaka@2.1.1 backend=serial
  packages:
    all:
      target:
      - aarch64
      - x86_64
      variants: build_type=Release
    mesa:
      buildable: false
    flex:
      # spack marks flex@2.6.3 as `preferred`, so it wins over the newer 2.6.4.
      # 2.6.3 ships a libtool 2.4.6 whose configure only knows deployment targets
      # `10.[012]` and `10.*`, so on macOS >= 11 it picks no allow-undefined flag
      # and linking libfl.dylib fails on the (intentionally) undefined `yylex`.
      # spack autoreconf's 2.6.4 with a modern libtool, which gets this right, and
      # patches the gcc/glibc issue that made 2.6.3 preferred in the first place.
      require:
      - "@2.6.4"
    xxhash:
      require:
      - +pic

  concretizer:
    unify: true

  config:
    install_tree:
      padded_length: 128
    connect_timeout: 60

  repos:
    acts: spack_repo/acts

  mirrors:
    acts-spack-buildcache:
      url: oci://ghcr.io/acts-project/spack-buildcache
      signed: false
      access_pair:
        id_variable: GH_OCI_USER
        secret_variable: GH_OCI_TOKEN
