# Spack config overlay for the `cuda90` flavor (NVIDIA, sm_90 / Hopper).
# Merged into the environment via `spack config add -f`. Config sections only —
# specs live in flavors/cuda90.specs. Express deltas from the base spack.yaml.
packages:
  all:
    # Applied only to packages that actually define a `cuda_arch` variant;
    # packages without it silently ignore this, so it is safe as an `all` entry.
    variants: [cuda_arch=90]
  # ONNX Runtime GPU (CUDA) execution provider.
  # NOTE: the variant is `+gpu` (NOT `+cuda`), and it is already default=True on
  # linux x86_64 — the base spack.yaml therefore ships the GPU binary even on the
  # CPU host image (it just falls back to CPU when CUDA is absent), so nothing
  # needs requiring here.
  #
  # TODO(gpu): the ORT CUDA EP is *not* usable in this flavor as it stands. The
  # pinned onnxruntime-bin@1.24.4 downloads onnxruntime-linux-x64-gpu-<ver>.tgz,
  # which is the CUDA 12 build, while this flavor pins cuda@13.3.0 (the image
  # forces it, see cuda90.specs), so the EP cannot load and ORT falls back to
  # CPU. Upstream does ship a CUDA 13 tarball -- but only from 1.25.1, and under
  # a new asset name (`gpu_cuda13`, alongside `gpu_cuda12` from 1.27.0), which
  # spack_repo/acts/packages/onnxruntime_bin hardcodes around. Getting the EP
  # working therefore needs all three of: bumping onnxruntime-bin, teaching that
  # package to pick the asset by CUDA major version, and adding a cudnn@9 spec
  # here (spack has 9.21.0.82-13, the CUDA 13 build) since ORT bundles none.
